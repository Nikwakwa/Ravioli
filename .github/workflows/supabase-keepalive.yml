name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days without activity.
# Co-op sync is parked (see ROADMAP.md), so the app itself no longer talks to
# Supabase. This tiny scheduled read keeps the project active until co-op returns.

on:
  schedule:
    # Every 5 minutes: triggers background Web Push checks and keeps Supabase active.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase tables and trigger background push
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          for table in cat_state activity_log; do
            curl --fail --silent --show-error --max-time 30 \
              "${SUPABASE_URL%/}/rest/v1/${table}?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY"
            echo
          done
          echo "Triggering send-push function..."
          EXTRA_ARGS=()
          if [ -n "$PUSH_CRON_SECRET" ]; then
            EXTRA_ARGS+=(-H "x-cron-secret: $PUSH_CRON_SECRET")
          fi
          HTTP_CODE=$(curl --silent --output /tmp/push-out.json --write-out "%{http_code}" --max-time 30 \
            -X POST "${SUPABASE_URL%/}/functions/v1/send-push" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${EXTRA_ARGS[@]}" \
            -d '{}' || true)
          echo "send-push HTTP status: $HTTP_CODE"
          cat /tmp/push-out.json || true
          echo
          if [ "${HTTP_CODE:-0}" -ge 500 ]; then
            echo "::warning::send-push returned HTTP $HTTP_CODE"
          fi
          echo "Supabase responded — project stays active."
