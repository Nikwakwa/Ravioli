name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days without activity.
# Co-op sync is parked (see ROADMAP.md), so the app itself no longer talks to
# Supabase. This tiny scheduled read keeps the project active until co-op returns.

on:
  schedule:
    # Every 6 hours at :17 UTC (odd minute avoids GitHub's busy top-of-hour slot).
    # Supabase requires a few requests per day to avoid inactivity pause warnings.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase tables
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          for table in cat_state activity_log; do
            curl --fail --silent --show-error --max-time 30 \
              "${SUPABASE_URL%/}/rest/v1/${table}?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY"
            echo
          done
          echo "Supabase responded — project stays active."
