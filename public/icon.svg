  <path d="M220 158 Q228 176 232 186" stroke="#d26a22" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M292 158 Q284 176 280 186" stroke="#d26a22" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- muzzle -->
