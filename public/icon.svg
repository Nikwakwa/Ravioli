  <!-- blush -->
  <ellipse cx="160" cy="322" rx="26" ry="15" fill="#ff8f8f" opacity="0.55"/>
  <ellipse cx="352" cy="322" rx="26" ry="15" fill="#ff8f8f" opacity="0.55"/>
  <!-- nose -->
  <path d="M240 312 L272 312 L256 330 Z" fill="#e8838a" stroke="#e8838a" stroke-width="4" stroke-linejoin="round"/>

  <!-- eyes -->
  <ellipse cx="196" cy="270" rx="30" ry="34" fill="#f6b800"/>
  <ellipse cx="316" cy="270" rx="30" ry="34" fill="#f6b800"/>
  <ellipse cx="196" cy="273" rx="15" ry="23" fill="#2b1a10"/>
  <ellipse cx="316" cy="273" rx="15" ry="23" fill="#2b1a10"/>
  <circle cx="188" cy="260" r="8" fill="#fff"/>
  <circle cx="308" cy="260" r="8" fill="#fff"/>
  <!-- smiling mouth -->
  <path d="M256 330 Q254 354 232 348 Q222 345 220 336 M256 330 Q258 354 280 348 Q290 345 292 336" stroke="#7a4630" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
